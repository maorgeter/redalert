version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: alertmap-postgres
    environment:
      POSTGRES_DB: alertmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: alertmap-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: alertmap
      DB_USER: postgres
      DB_PASSWORD: postgres
      OREF_INGESTION: 'false'
      MOCK_INGESTION: 'true'
      CORS_ORIGIN: 'http://localhost:3000'
    ports:
      - '3001:3001'
    # Path must match container WORKDIR (/app/packages/backend) + data subfolder.
    # The old path /app/data was wrong and caused geofences to fail to load.
    volumes:
      - ./packages/backend/data:/app/packages/backend/data:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
      # They must be provided as build args — the runtime environment block
      # below cannot override values already compiled into the bundle.
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
        NEXT_PUBLIC_WS_URL: ws://localhost:3001
    container_name: alertmap-frontend
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      # HOSTNAME must be 0.0.0.0 so Next.js standalone binds to all interfaces
      # (not just 127.0.0.1) and is reachable through Docker's port mapping.
      HOSTNAME: '0.0.0.0'
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  pgdata:
