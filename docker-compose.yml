version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: alertmap-postgres
    environment:
      POSTGRES_DB: alertmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .  # התיקון כאן: הופך את כל הפרויקט לזמין ל-Docker
      dockerfile: packages/backend/Dockerfile
    container_name: alertmap-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: alertmap
      DB_USER: postgres
      DB_PASSWORD: postgres
      OREF_INGESTION: 'true'
      MOCK_INGESTION: 'false'
      CORS_ORIGIN: 'http://localhost:3000'
    ports:
      - '3001:3001'
    volumes:
      - ./packages/backend/data:/app/data:ro
    restart: unless-stopped

  frontend:
    build:
      context: .  # גם כאן: ה-context הוא השורש
      dockerfile: packages/frontend/Dockerfile
      # מוסיף את ה-Build Args שקלוד הגדיר ב-Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:3001
        - NEXT_PUBLIC_WS_URL=ws://localhost:3001
    container_name: alertmap-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3000 # לוקאלית הפרונט עובר דרך ה-proxy של Next
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  pgdata:
